name: Update list

on:
  schedule:
    # 03:00 UTC is 06:00 in Addis Ababa.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild the list
        run: python -m a2sv_roles
      - name: Commit the new list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/roles.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update the role list"
            git push
          fi
